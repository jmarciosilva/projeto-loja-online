services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: loja-app
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - app_vendor:/app/vendor
      - app_node_modules:/app/node_modules
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-loja_online}
      - DB_USERNAME=${DB_USERNAME:-loja_user}
      - DB_PASSWORD=${DB_PASSWORD:-senha_segura}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=cookie
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loja-network
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nginx Web Server
  nginx:
    image: nginx:1.27-alpine
    container_name: loja-nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-80}:80"
    volumes:
      - ./:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - loja-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL Database
  mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    container_name: loja-mysql
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_senha_segura}
      MYSQL_DATABASE: ${DB_DATABASE:-loja_online}
      MYSQL_USER: ${DB_USERNAME:-loja_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha_segura}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - loja-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: loja-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - loja-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Node.js (NPM & Vite)
  node:
    image: node:20-alpine
    container_name: loja-node
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    networks:
      - loja-network
    command: tail -f /dev/null
    # Override with: docker compose exec node npm install
    # Then: docker compose exec node npm run dev

  # phpMyAdmin (Database Admin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: loja-phpmyadmin
    restart: unless-stopped
    ports:
      - "${DOCKER_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-loja_user}
      PMA_PASSWORD: ${DB_PASSWORD:-senha_segura}
    depends_on:
      - mysql
    networks:
      - loja-network

  # MailPit (Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: loja-mailpit
    restart: unless-stopped
    ports:
      - "${DOCKER_MAILPIT_PORT:-8025}:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - loja-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mailpit_data:
    driver: local
  app_vendor:
    driver: local
  app_node_modules:
    driver: local

networks:
  loja-network:
    driver: bridge
