; PHP overrides for local development.
; Note: php.ini comments use ';' — '#' is not valid here.

date.timezone = America/Sao_Paulo

; Errors: verbose for development. Flip display_errors Off in production.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M

upload_max_filesize = 100M
post_max_size = 100M

max_execution_time = 300
max_input_time = 300

session.gc_maxlifetime = 86400

; OPcache with timestamp validation so edited files are picked up immediately.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.interned_strings_buffer = 16

; Xdebug is installed but idle by default: start_with_request=yes makes every
; request attempt a debugger connection, which slows the app down noticeably.
; To debug, set xdebug.mode=debug and xdebug.start_with_request=yes.
[xdebug]
xdebug.mode = off
xdebug.start_with_request = no
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
