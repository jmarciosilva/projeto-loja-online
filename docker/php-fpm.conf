; Application php-fpm pool overrides.
; Loaded after the base image's zz-docker.conf.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 1000

; Endpoint used by the container healthcheck.
ping.path = /ping
ping.response = pong

; Send worker output to the container log instead of swallowing it.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Keep compose-provided env vars visible to PHP.
clear_env = no

request_terminate_timeout = 300
security.limit_extensions = .php
